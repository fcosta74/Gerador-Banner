<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Banners - FCS Divulgações</title>
  <meta name="theme-color" content="#0086FF" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" >
  <link rel="apple-touch-icon" href="./img/icon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <h2>🎯 Gerador de Banner - Mercado Livre</h2>
  <div class="main-container">
    <!-- FORMULÁRIO DE DADOS -->
    <div class="form-container">
      <!-- Seleção da Loja -->
      <div class="form-group">
        <label for="loja">Selecione a Loja:</label>
        <select id="loja" class="form-control" onchange="gerarBanner()">
          <option value="mercadolivre">Mercado Livre</option>
          <option value="kabum">KaBuM!</option>
        </select>
      </div>

      <!-- Buscar Link Mercado Livre -->
      <div class="form-group">
        <label for="urlML">Puxar dados pelo link do Mercado Livre:</label>
        <div class="input-with-button">
          <input type="text" id="urlML" placeholder="https://www.mercadolivre.com.br/p/MLB..." class="form-control">
          <button type="button" id="btnBuscarML" class="btn-buscar" onclick="buscarDadosML()">Buscar</button>
          <button type="button" id="btnLimparML" class="btn-limpar" onclick="limparDadosML()">Limpar</button>
        </div>
      </div>

      <hr class="divider">

      <!-- Título do Produto -->
      <div class="form-group">
        <label for="descricao">Título / Descrição do Produto:</label>
        <textarea id="descricao" rows="3" class="form-control" placeholder="Digite o nome do produto..." oninput="gerarBanner()"></textarea>
      </div>

      <!-- Preço De e Preço Por -->
      <div class="row">
        <div class="form-group">
          <label for="precoOriginal">Preço De (R$):</label>
          <input type="text" id="precoOriginal" class="form-control" placeholder="Ex: 2.699,00" oninput="gerarBanner()">
        </div>
        <div class="form-group">
          <label for="precoVista">Preço Por (R$):</label>
          <input type="text" id="precoVista" class="form-control" placeholder="Ex: 2.089,05" oninput="gerarBanner()">
        </div>
      </div>

      <!-- Parcelamento e Cupom -->
      <div class="row">
        <div class="form-group">
          <label for="parcelado">Parcelamento:</label>
          <input type="text" id="parcelado" class="form-control" placeholder="Ex: em 10x de R$ 208,90 sem juros" oninput="gerarBanner()">
        </div>
        <div class="form-group">
          <label for="cupom">Cupom:</label>
          <input type="text" id="cupom" class="form-control" placeholder="Ex: PREFERIDO" oninput="gerarBanner()">
        </div>
      </div>

      <!-- Classificação e Frete -->
      <div class="row">
        <div class="form-group">
          <label for="avaliacao">Avaliação:</label>
          <input type="text" id="avaliacao" class="form-control" placeholder="Ex: 4.7" oninput="gerarBanner()">
        </div>
        <div class="form-group">
          <label for="frete">Frete:</label>
          <select id="frete" class="form-control" onchange="gerarBanner()">
            <option value="Selecione">Selecione</option>
            <option value="Frete Grátis">Frete Grátis</option>
            <option value="Frete Pago">💸 Frete Pago</option>
            <option value="Retirada no local">🏢 Retirada no local</option>
            <option value="Consulte o CEP" selected>🔍 Consulte o CEP</option>
            <option value="Entrega expressa">⚡ Entrega expressa</option>
          </select>
        </div>
      </div>

      <!-- Legenda Pronta -->
      <div class="form-group" style="margin-top: 15px;">
        <label for="legendaPronta"><strong>Legenda Pronta para WhatsApp / Telegram:</strong></label>
        <textarea id="legendaPronta" rows="5" class="form-control" readonly></textarea>
      </div>

      <!-- Upload de Imagem Manual -->
      <div class="form-group">
        <label for="imagemInput">Imagem Manual do Produto:</label>
        <input type="file" id="imagemInput" accept="image/*" class="form-control-file">
      </div>

      <!-- Botões de Ação -->
      <div style="display: flex; gap: 10px; margin-top: 8px;">
        <button type="button" onclick="copiarLegenda()" style="background: #25D366; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold;">
          📋 Copiar Legenda
        </button>
        <button type="button" onclick="baixarImagem()" style="background: #2D3277; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold;">
          📥 Baixar Imagem do Banner
        </button>
      </div>

    </div>
    <!-- ÁREA DE PRÉ-VISUALIZAÇÃO DO CANVAS -->
    <div class="preview-container">
      <canvas id="bannerCanvas"></canvas>
    </div>
  </div>

  <script src="banner.js"></script>
</body>
</html>
